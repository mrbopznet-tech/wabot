version: '3.8'

services:
  wa-bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: wa-group-bot
    restart: unless-stopped

    # Environment variables (override in Portainer or use .env file)
    environment:
      - NODE_ENV=production
      - EVOLUTION_API_URL=${EVOLUTION_API_URL:-http://evolution-api:8080}
      - EVOLUTION_API_KEY=${EVOLUTION_API_KEY}
      - EVOLUTION_INSTANCE_NAME=${EVOLUTION_INSTANCE_NAME}
      - BOT_PORT=${BOT_PORT:-3000}
      - BOT_WEBHOOK_PATH=${BOT_WEBHOOK_PATH:-/webhook}
      - ADMINS=${ADMINS}
      - WELCOME_MESSAGE_ENABLED=${WELCOME_MESSAGE_ENABLED:-true}
      - BLAST_USE_TYPING=${BLAST_USE_TYPING:-false}
      - BLAST_MIN_DELAY=${BLAST_MIN_DELAY:-3000}
      - BLAST_MAX_DELAY=${BLAST_MAX_DELAY:-8000}
      - BLAST_MAX_TARGETS=${BLAST_MAX_TARGETS:-50}
      - RATE_LIMIT_MAX_REQUESTS=${RATE_LIMIT_MAX_REQUESTS:-10}
      - RATE_LIMIT_WINDOW_MS=${RATE_LIMIT_WINDOW_MS:-60000}
      # - WEBHOOK_SECRET=${WEBHOOK_SECRET}  # Uncomment for production

      # Port mapping (adjust if needed)
    ports:
      - "3000:3000"

    # Volume mounts for persistence
    volumes:
      - ./admins.json:/app/admins.json
      - ./logs:/app/logs

    # Network - IMPORTANT: Use same network as Evolution API
    networks:
      - evolution-network

    # Health check
    healthcheck:
      test: [ "CMD", "node", "-e", "require('http').get('http://localhost:3000/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

    # Logging
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

# Networks
networks:
  evolution-network:
    external: true # Use existing Evolution API network
    name: wagateway_evolution_network # Actual network name from server
    # If Evolution API network doesn't exist, create it:
    # external: false
    # driver: bridge
